name: vst3-tani

# VST3 diagnosis with "[vst3tani]" in the commit message: MicVST's real plug-in scanner
# (MicVST.exe --scan <bundle> --out <file>, a separate process as in the app) run 20 times per free
# test plug-in, with and without full CPU load - how often a plug-in's own scan code ends the scan
# process, and that it never takes anything else down (exit codes counted). Then the in-process path
# of the engine test (long 2, ETEST_PROGRESS). Results: ci-sonuclari/<branch>-vst3tani.
on:
  push:
    branches: [ 'kararlilik/**' ]

permissions:
  contents: write

jobs:
  diag:
    if: ${{ contains(github.event.head_commit.message, '[vst3tani]') }}
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: pwsh
        run: ./tools/ci-build.ps1 -Source . -Build build -Targets "MicVST MicVSTEngineTest" -Out results
      - name: Scanner runs
        continue-on-error: true
        shell: pwsh
        run: |
          . ./tools/ci-suite-plugins.ps1 -NoteFile results/vst3-suite-source.txt
          $app = (Resolve-Path "build/MicVST_artefacts/Release/MicVST.exe").Path
          $etest = (Resolve-Path "build/MicVSTEngineTest_artefacts/Release/MicVSTEngineTest.exe").Path
          $all = $env:MICVST_TEST_VST3_DIR
          $bundles = @(Get-ChildItem $all -Filter "*.vst3")
          $report = "results/scanner.md"
          "| Plug-in | load | runs | exit 0 (found) | crashed (code) | other |" | Set-Content $report
          "|---|---|---:|---:|---|---:|" | Add-Content $report
          foreach ($load in @($false, $true)) {
            $burn = $null
            if ($load) { $burn = Start-Process -FilePath $etest -ArgumentList @("burn", "$([Environment]::ProcessorCount)", "1800") -PassThru -WindowStyle Hidden }
            foreach ($b in $bundles) {
              $ok = 0; $other = 0; $crashes = @{}
              for ($i = 0; $i -lt 20; $i++) {
                $out = Join-Path $env:RUNNER_TEMP "scan-out.xml"
                Remove-Item $out -ErrorAction SilentlyContinue
                $p = Start-Process -FilePath $app -ArgumentList @("--scan", "`"$($b.FullName)`"", "--out", "`"$out`"") -PassThru -WindowStyle Hidden
                if (-not $p.WaitForExit(120000)) { $p.Kill(); $other++; continue }
                $c = $p.ExitCode
                if ($c -eq 0) { $ok++ }
                elseif ($c -lt 0 -or $c -gt 255) { $k = "0x{0:X8}" -f $c; $crashes[$k] = 1 + [int] $crashes[$k] }
                else { $other++ }
              }
              $cr = ($crashes.GetEnumerator() | ForEach-Object { "$($_.Key) x$($_.Value)" }) -join ", "
              "| $($b.Name) | $(if ($load) { 'full CPU load' } else { 'idle' }) | 20 | $ok | $(if ($cr) { $cr } else { '0' }) | $other |" | Add-Content $report
            }
            if ($burn) { Stop-Process -Id $burn.Id -Force -ErrorAction SilentlyContinue }
          }
          $env:ETEST_LONG_VST3 = "1"; $env:ETEST_PROGRESS = "1"; $env:ETEST_LONG_PRIORITY = "0"
          $env:ETEST_LONG_BURN = "$([Environment]::ProcessorCount)"
          ./tools/ci-run-timed.ps1 -Exe $etest -OutFile results/long-burn-after-chain.txt -TimeoutSeconds 900 -Arguments @("long", "3")
          Get-Content $report
      - name: Publish
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/ci-publish.ps1 -Dir results -Branch "ci-sonuclari/${{ github.ref_name }}-vst3tani" -Message "MicVST ${{ github.ref_name }} vst3 diagnosis"
