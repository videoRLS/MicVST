name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Kein Generator gepinnt: windows-latest wechselt die VS-Version (aktuell VS2026);
      # CMake nimmt automatisch das installierte Visual Studio des Runner-Images.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target MicVST MicVSTTests MicVSTStress

      - name: Unit tests
        run: ./build/MicVSTTests_artefacts/Release/MicVSTTests.exe

      - name: Audio path measurements (quick)
        run: ./build/MicVSTStress_artefacts/Release/MicVSTStress.exe --quick

      - name: Closed box - no networking library in the exe
        shell: pwsh
        run: ./tools/check-no-network.ps1 build/MicVST_artefacts/Release/MicVST.exe

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: MicVST
          path: build/MicVST_artefacts/Release/MicVST.exe
